aid: starry
name: Starry
description: 'Starry, Inc. is a Boston-founded (2014) internet service provider that
  delivers fixed wireless broadband to multi-dwelling buildings and homes in five US
  metropolitan markets — Boston, New York City, Los Angeles, Denver and Washington,
  D.C. — over its own licensed millimeter-wave spectrum and proprietary radio hardware
  rather than leased last-mile cable or fiber. Consumer plans run from Starry 200 (200
  Mbps, $30/mo) to Starry Gigabit (1 Gbps, $45/mo), month-to-month with no data caps,
  a bundled Wi-Fi router and a three-year price lock, alongside a Starry Connect program
  for affordable-housing properties and a wholesale/bulk offering for property owners.
  Starry restructured through Chapter 11 in 2023 and was acquired by Verizon in a deal
  announced October 2025. It is a consumer/property-facing broadband operator: it runs
  an authenticated customer account portal and publishes an llms.txt and a substantial
  open-source GitHub organization, but it operates no public developer program and
  publishes no machine-readable API contract.'
