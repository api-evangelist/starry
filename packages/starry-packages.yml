method: searched
source: https://github.com/StarryInternet + registry.npmjs.org metadata for each package
note: >-
  IMPORTANT SCOPE NOTE — none of these are API client SDKs. Starry publishes no public
  API, so it ships no client library for one. What the StarryInternet GitHub organization
  (verified, 57 public repos, Boston MA) and its npm account do publish is a set of
  first-party general-purpose open-source utilities written for Starry's own network and
  device stack: stream message framing, memoization, US street-address parsing, cron/
  supervisord helpers, an internal ESLint config, and a Swift CoreBluetooth wrapper. They
  are recorded here as a real, dated, first-party published-code surface. NO `SDKs`
  pointer is wired in apis.yml, because wiring one would credit Starry with client
  libraries for an API it does not operate.
registries_checked:
- registry.npmjs.org
- github.com/StarryInternet (releases + tags)
decay_signal: >-
  Every JavaScript package here last published between 2017 and 2021. The most recently
  released is eslint-plugin-starry 8.0.0 (2021-10-18); the most recently touched source
  repository is fringe (pushed 2026-08-13) whose npm release still dates to 2019-02-19.
  A consumer installing any of these today gets a build five to nine years old.
